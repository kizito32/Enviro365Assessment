spring.application.name=withdrawal-notice-system

# In-memory H2: data is re-seeded on every start (see DataSeeder)
spring.datasource.url=jdbc:h2:mem:enviro;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Entities are mapped to DTOs inside service transactions, so no lazy loading in the web layer
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Never leak stack traces to clients
server.error.include-stacktrace=never
